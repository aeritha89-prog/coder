[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coder"
version = "0.1.0"
description = "A command-line coding assistant with Docker isolation and project memory"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
    "tavily>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.10", "types-PyYAML>=6,<7"]

[project.scripts]
coder = "coder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv"]
cache_dir = ".cache/pytest/cache"

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".cache/ruff"
extend-exclude = [".cache", ".uv-cache", ".pytest-tmp", ".tmp", ".uv-python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
cache_dir = ".cache/mypy"
mypy_path = "src"
packages = ["coder"]
check_untyped_defs = true
